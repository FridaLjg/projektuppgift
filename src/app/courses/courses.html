<h2>Kurser</h2>

<label for="search">Sök efter kurs:</label>
<br>
<input type="text" id="search" placeholder="Sök efter kurs..." (input)="searchTerm.set($any($event.target).value)">

<table>
    <thead>
        <tr>
            <th>Kurskod</th>
            <th>Kursnamn</th>
            <th>Poäng</th>
            <th>Ämne</th>
            <th>Kursplan</th>
            <th>Lägg till</th>
        </tr>
    </thead>

    <tbody>
        @for (course of filteredCourses(); track course.courseCode) {
        <tr>
            <td>{{ course.courseCode }}</td>
            <td>{{ course.courseName }}</td>
            <td>{{ course.points }} hp</td>
            <td>{{ course.subject }}</td>
            <td>
                <a [href]="course.syllabus" target="_blank" rel="noopener noreferrer">
                    Kursplan
                </a>
            </td>
            <td>
                <button type="button" (click)="addToTimetable(course)">
                    Lägg till
                </button>
            </td>
        </tr>
        }
    </tbody>
</table>
